name: Build and Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.4"

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install Node dependencies
        working-directory: app
        run: npm install

      - name: Build React App
        working-directory: app
        run: npm run build

      - name: Install Python dependencies
        run: |
          pip install pipenv
          pipenv sync --dev

      - name: Validate bridge configuration and worker entry
        run: pipenv run python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build .exe with PyInstaller
        run: |
          pipenv run pyinstaller --noconfirm --clean main.spec
          echo "Build completed. Listing all files in dist directory:"
          dir dist

      - name: Validate the portable executable
        run: |
          $resultPath = Join-Path $env:GITHUB_WORKSPACE 'bridge-bundle-test.json'
          $process = Start-Process -FilePath (Join-Path $env:GITHUB_WORKSPACE 'dist/pokemacro.exe') -ArgumentList @('--bridge-self-test', $resultPath) -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0 -or -not (Test-Path $resultPath)) { throw 'Portable bridge self-test failed' }
          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          if (-not $result.passed -or -not $result.frozen) { throw 'The executable does not contain a working bridge' }
          Get-Content -LiteralPath $resultPath

      - name: List build artifacts
        run: |
          echo "Contents of dist folder:"
          dir dist
          echo ""
          echo "Checking for single executable (pokemacro.exe)..."
          if (Test-Path "dist/pokemacro.exe") {
            echo "✓ Single executable found: dist/pokemacro.exe"
            $exe = Get-ChildItem "dist/pokemacro.exe"
            echo "File size: $([math]::Round($exe.Length / 1MB, 2)) MB"
            echo "Creation time: $($exe.CreationTime)"
          } else {
            echo "✗ Single executable NOT found at dist/pokemacro.exe"
            echo "Checking for legacy folder structure..."
            if (Test-Path "dist/pokemacro") {
              echo "✓ Found legacy folder structure"
              dir dist/pokemacro
              if (Test-Path "dist/pokemacro/pokemacro.exe") {
                $exe = Get-ChildItem "dist/pokemacro/pokemacro.exe"
                echo "Executable size: $([math]::Round($exe.Length / 1MB, 2)) MB"
              }
            } else {
              echo "✗ No executable found in either location!"
              echo "Available files in dist:"
              Get-ChildItem dist -Recurse | Format-Table Name, Length, FullName
              exit 1
            }
          }

      - name: Create Release Archive
        run: |
          @'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          executable = Path('dist/pokemacro.exe')
          with ZipFile('pokemacro-release.zip', 'w', ZIP_DEFLATED, compresslevel=1, allowZip64=True) as archive:
              archive.write(executable, 'pokemacro.exe')
          with ZipFile('pokemacro-release.zip') as archive:
              assert archive.getinfo('pokemacro.exe').file_size == executable.stat().st_size
          print(f'Archive created: {Path("pokemacro-release.zip").stat().st_size} bytes')
          '@ | pipenv run python
          if ($LASTEXITCODE -ne 0) { throw 'Release archive creation failed' }

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: pokemacro-release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
